    + '<div class="memo">메모: 민수 (월급날 바로 갚는대)</div></div>',
  chat: () => '<div class="shot">' + bar('background:#b9cde0') + '<div class="cb"><div class="t">민수</div>'
    + '<div class="cd">2024년 9월 20일 금요일</div><div class="cm m">민수야 그 돈 언제 줘?</div><div class="cm">야 담주에 줄게 ㅇㅇ</div><div class="cm">월급날 바로 줄게!! 걱정 ㄴㄴ 🙏</div>'
    + '<div class="cd">2025년 3월 2일 일요일</div><div class="cm m">그 돈 아직이야…?</div><div class="cm">아 다음 달에 줄게ㅠㅠ 진짜 약속</div><div class="cm m">그 소리 반년째다</div><div class="cm">ㅋㅋㅋ 진짜야 진짜</div></div></div>',
  sns: () => '<div class="shot sn">' + bar('') + '<div class="u"><div class="p">민</div><span><b>minsu_daily</b> · 2시간</span></div>'
    + '<div class="big">🍣</div><div class="cap">오늘은 내 돈으로 오마카세 ✨ #플렉스</div><div class="loc">📍 청담 스시 · ❤️ 128</div></div>',
  empty: () => '<div class="shot">' + bar('background:#0f6b4f;color:#fff') + '<div class="bh"><small>새싹뱅크</small><b>입금내역 · 오늘</b></div>'
    + '<div class="empty"><div style="font-size:30px">📭</div><div style="margin-top:6px"><b>조회된 입금내역이 없습니다</b></div><div style="margin-top:4px;font-size:10px">입금액 합계 0원</div></div></div>'
};
function pickImg(e){ return rnd(e.img || ["bank","chat"]); }
function imgBubble(key){
  if (lastB && lastB.side === "me") lastB.el.classList.remove("tail");
  const d = document.createElement("div"); d.className = "b me img"; d.innerHTML = SHOT[key]();
  $("chat").appendChild(d); lastB = {side:"me", el:d}; $("chat").scrollTop = 1e6;
}


function bubble(side, text){
  const c = $("chat");
  if (lastB && lastB.side === side) lastB.el.classList.remove("tail");
  const d = document.createElement("div");
  d.className = "b " + side + " tail" + (lastB && lastB.side === side ? " g" : "");
  d.textContent = text; c.appendChild(d); lastB = {side, el:d}; c.scrollTop = 1e6; return d;
}
function note(cls, text){ const d = document.createElement("div"); d.className = cls; d.textContent = text; $("chat").appendChild(d); lastB = null; $("chat").scrollTop = 1e6; return d; }
function meters(){
  $("g").style.width = Math.max(0, S.g) + "%"; $("gv").textContent = Math.max(0, S.g);
  $("f").style.width = (S.paid / TOTAL * 100) + "%"; $("fv").textContent = won(S.paid);
  $("turn").textContent = "남은 기회 " + Math.max(0, MAX - S.t) + "번";
}
function chips(on){
  $("chips").innerHTML = "";
  T.forEach((t,i)=>{
    const b = document.createElement("button");
    b.textContent = t.ic + " " + t.n; b.disabled = !on;
    b.onclick = () => pick(i, b); $("chips").appendChild(b);
  });
}
function pick(i, btn){
  if (busy) return;
  [...$("chips").children].forEach(x => x.classList.remove("on")); btn.classList.add("on");
  pend = {i, text: rnd(T[i].m), img: i === 1 ? pickImg(S.e) : null};
  $("txt").textContent = (pend.img ? "🖼️ " : "") + pend.text; $("txt").className = "f"; $("send").className = "on";
}
function clearInput(){ pend = null; $("txt").textContent = "iMessage"; $("txt").className = ""; $("send").className = ""; }
function start(){
  S = {g:100, paid:0, t:0, lastT:-1, done:{}}; last = -1; busy = false; lastB = null; clearInput();
  $("chat").innerHTML = "";
  note("time", "iMessage\n오늘 오전 9:41");
  note("note", "2년 전 추석, 민수가 “월급날 바로 줄게” 하고 빌려간 500,000원.\n핑계마다 잘 통하는 방법이 다르다. 같은 수만 계속 쓰면 안 먹힌다.");
  meters(); next();
}
function next(){
  if (S.t >= MAX) return end(false);
  let i; do { i = Math.floor(Math.random() * E.length) } while (i === last);
  last = i; S.e = E[i];
  if (S.e.sys) note("note", S.e.sys);
  else if (S.e.isSys) note("note", rnd(S.e.m));
  else bubble("them", rnd(S.e.m));
  busy = false; chips(true); meters();
}
$("send").onclick = async function(){
  if (busy || !pend) return;
  busy = true; const p = pend; chips(false); clearInput();
  if (p.img) imgBubble(p.img);
  const my = bubble("me", p.text);
  document.querySelectorAll(".st").forEach(x => x.remove());
  const st = note("st", "전달됨"); lastB = {side:"me", el:my};
  await sleep(700); st.textContent = "읽음";
  await sleep(500);
  const dots = bubble("them", ""); dots.classList.add("dots"); dots.innerHTML = "<span></span><span></span><span></span>";
  await sleep(1000); dots.remove(); lastB = {side:"me", el:my};
  let sc = S.e.s[p.i];
  const rep = p.i === S.lastT; if (rep) sc = Math.max(0, sc - 1);
  S.lastT = p.i; S.t++;
  S.g = Math.min(100, Math.max(0, S.g + [3,-8,-16][sc]));
  const tb = document.createElement("div"); tb.className = "tb"; tb.textContent = ["👎","👍","‼️"][sc]; my.appendChild(tb);
  bubble("them", (R2[p.i] || S.e.r)[2 - sc]);
  note("note", rep ? "같은 수를 또 썼다. 민수가 눈치챘다." : ["역효과… 민수가 기운을 되찾았다.","먹혔다!","효과가 굉장했다!"][sc]);
  meters(); await sleep(700);
  for (const [th, amt] of PHASE) if (S.g <= th && !S.done["p"+th]) { S.done["p"+th] = 1; note("note", amt); }
  for (const [th, amt] of PAY) if (S.g <= th && !S.done[th]) {
    S.done[th] = 1; S.paid += amt; note("pay", "💸 민수가 " + won(amt) + "을 보냈다"); meters(); await sleep(600);
  }
  if (S.g <= 0) return end(true);
  next();
};
function end(win){
  chips(false);
  const left = TOTAL - S.paid;
  const R = win
    ? ["💸 500,000원 완납!", S.t <= 12 ? S.t + "번 만에 전액 회수. 민수가 이렇게 빨리 무너질 줄이야." : S.t + "번 만에 전액 회수. 끈질기게 버틴 민수를 결국 꺾었다."]
    : ["📆 “다음 달에 줄게”", S.paid ? "기회를 다 썼다. " + won(S.paid) + "은 받았지만 " + won(left) + "이 남았다. 민수는 이번에도 웃고 있다." : "기회를 다 썼다. 한 푼도 못 받았다. 민수는 이번에도 웃고 있다."];
  const d = document.createElement("div"); d.className = "card";
  d.innerHTML = "<h2></h2><p></p><button>다시 도전하기</button>";
  d.children[0].textContent = R[0]; d.children[1].textContent = R[1];
  d.children[2].onclick = start;
  $("chat").appendChild(d); $("chat").scrollTop = 1e6;
}
$("chat").style.whiteSpace = "pre-line";
start();
</script>
</body>
</html>
