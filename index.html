</style>
</head>

  } else if (stage === 3 && p.i === 4 && sc === 0) {
    S.cost += 800000; S.bill = 800000; S.force = 11;
    note("note", "👊 현피 발발! 멱살잡이 끝에 경찰이 출동했다. 깽값 " + won(800000) + " 지출…\n박 사장이 진단서를 들고 깽값을 청구해 왔다!");
  }
  meters(); await sleep(700);
  for (const [th, amt] of PHASE) if (S.g <= th && !S.done["p"+th]) { S.done["p"+th] = 1; note("note", amt); }
  for (const [th, amt] of PAY) if (S.g <= th && !S.done[th]) {
    S.done[th] = 1; S.paid += amt; note("pay", stage === 3 ? "🏦 회수된 " + won(amt) + "이 입금됐다" : "💸 민수가 " + won(amt) + "을 보냈다"); meters(); await sleep(600);
  }
  if (S.g <= 0) return end(true);
  next();
};
function end(win){
  busy = false; chips(false);
  const left = TOTAL - S.paid;
  let R;
  if (win && stage === 1) {
    unlocked = true; $("back").classList.add("alert");
    R = ["💸 " + won(TOTAL) + " 완납!", (S.t <= 12 ? S.t + "번 만에 전액 회수. 민수가 이렇게 빨리 무너질 줄이야." : S.t + "번 만에 전액 회수. 끈질기게 버틴 민수를 결국 꺾었다.") + "\n\n그런데… 위쪽에 안 읽은 메시지 3개가 와 있다. 눌러 보자."];
  } else if (win && stage === 2) {
    unlocked3 = true; $("bd").style.display = ""; $("bd").textContent = "1"; $("back").classList.add("alert");
    R = ["🏆 " + won(TOTAL) + " 완납!", S.t + "번 만에 태호까지 무너뜨렸다. 당신은 전설의 채권추심러.\n\n그런데… 위쪽에 새 메시지 1개가 와 있다. 이번엔 금액이 다르다. 눌러 보자."];
  } else if (win) {
    S.paid += 10000000; meters(); note("pay", "🤝 합의서 서명! 위자료 " + won(10000000) + " 추가");
    R = ["🏆 합의 성사! " + won(S.paid), "원금 " + won(10000000) + " + 위자료 " + won(10000000) + ". 박 사장이 합의서에 서명했다.\n지출한 비용 " + won(S.cost) + " → 순이익 " + won(S.paid - S.cost) + ".\n법대로 하니 이렇게 행복하다. 😭"];
  } else if (stage === 3) {
    R = ["📆 “소송은 길게 갑니다”", "기회를 다 썼다. 회수한 돈 " + won(S.paid) + ", 지출한 비용 " + won(S.cost) + ". 법정은 아직 멀다…"];
  } else {
    R = ["📆 “다음 달에 줄게”", S.paid ? "기회를 다 썼다. " + won(S.paid) + "은 받았지만 " + won(left) + "이 남았다. 민수는 이번에도 웃고 있다." : "기회를 다 썼다. 한 푼도 못 받았다. 민수는 이번에도 웃고 있다."];
  }
  const d = document.createElement("div"); d.className = "card";
  d.innerHTML = "<h2></h2><p></p><button>다시 도전하기</button>";
  d.children[0].textContent = tx(R[0]); d.children[1].textContent = tx(R[1]);
  d.children[2].onclick = start;
  $("chat").appendChild(d); $("chat").scrollTop = 1e6;
}
$("back").onclick = () => {
  if (busy) return;
  if (stage === 1 && unlocked) { stage = 2; start(); }
  else if (stage === 2 && unlocked3) { stage = 3; start(); }
};
$("chat").style.whiteSpace = "pre-line";
start();
</script>
</body>
