<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그 돈 언제 줄래</title>
<style>
:root{--blue:#0b84fe;--gray:#e9e9eb;--line:#d1d1d6;--sub:#8e8e93;--red:#ff453a;--green:#34c759;--amber:#ffb300}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#d8dbe2;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:#000;display:flex;justify-content:center;align-items:center;-webkit-font-smoothing:antialiased}
.phone{width:100%;max-width:410px;height:100dvh;background:#fff;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top);position:relative}
@media(min-width:520px){.phone{height:min(860px,96dvh);border-radius:40px;box-shadow:0 0 0 10px #111,0 20px 60px rgba(0,0,0,.35)}}

/* 메인 로비 UI */
.lobby{display:flex;flex-direction:column;height:100%;background:#f2f2f7;padding:24px 18px;overflow-y:auto}
.lobby-header{margin:20px 0 24px;text-align:center}
.lobby-title{font-size:28px;font-weight:800;color:#1c1c1e;letter-spacing:-0.5px}
.lobby-sub{font-size:14px;color:var(--sub);margin-top:6px}
.stage-list{display:flex;flex-direction:column;gap:14px}
.stage-card{background:#fff;border-radius:20px;padding:18px 20px;box-shadow:0 4px 12px rgba(0,0,0,.05);display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;border:1.5px solid transparent}
.stage-card:active{transform:scale(0.98);background:#f9f9fb}
.stage-card.cleared{border-color:var(--green)}
.stage-info h3{font-size:18px;font-weight:700;color:#1c1c1e;display:flex;align-items:center;gap:6px}
.stage-info p{font-size:13px;color:var(--sub);margin-top:4px}
.stage-tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;background:#e5e5ea;color:#3a3a3c}
.stage-card.cleared .stage-tag{background:#e6f8ec;color:#17803a}

/* 게임 영역 UI */
.game-view{display:none;flex-direction:column;height:100%}
.game-view.active{display:flex}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;background:rgba(246,246,248,.95);border-bottom:.5px solid var(--line)}
.back-btn{color:var(--blue);font-size:16px;font-weight:600;border:0;background:none;cursor:pointer;display:flex;align-items:center;gap:2px}
.who{display:flex;flex-direction:column;align-items:center}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(#a5acb8,#7d8594);color:#fff;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center}
.nm{font-size:11.5px;margin-top:2px}
.nm i{color:var(--sub);font-style:normal}
.sp{width:50px}
.hud{padding:8px 14px 9px;background:#f6f6f8;border-bottom:.5px solid var(--line)}
.top{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:6px}
.top b{color:#000;font-weight:600}
.ms{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.m span{font-size:11px;color:var(--sub);display:flex;justify-content:space-between}
.bar{height:5px;border-radius:3px;background:#dcdce0;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:3px;transition:width .5s}

#chat{flex:1;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:2px;background:#fff}
.time{align-self:center;font-size:11px;color:var(--sub);margin:6px 0 8px;text-align:center;line-height:1.4}
.b{position:relative;max-width:75%;padding:7px 13px;border-radius:18px;font-size:16.5px;line-height:1.3;margin-top:5px;word-break:keep-all;overflow-wrap:anywhere;animation:pop .18s ease-out}
.b.g{margin-top:1px}
.me{align-self:flex-end;background:var(--blue);color:#fff}
.them{align-self:flex-start;background:var(--gray)}
.tail::before,.tail::after{content:"";position:absolute;bottom:0}
.me.tail::before{right:-7px;width:20px;height:18px;background:var(--blue);border-bottom-left-radius:16px 14px}
.me.tail::after{right:-10px;width:10px;height:20px;background:#fff;border-bottom-left-radius:10px}
.them.tail::before{left:-7px;width:20px;height:18px;background:var(--gray);border-bottom-right-radius:16px 14px}
.them.tail::after{left:-10px;width:10px;height:20px;background:#fff;border-bottom-right-radius:10px}
.tb{position:absolute;top:-13px;left:-12px;width:27px;height:27px;border-radius:50%;background:var(--gray);border:2px solid #fff;font-size:13px;display:flex;align-items:center;justify-content:center;animation:pop .25s ease-out}
.st{align-self:flex-end;font-size:11px;color:var(--sub);margin:3px 3px 0 0;font-weight:500}
.note{align-self:center;font-size:12px;color:var(--sub);margin:8px 20px;text-align:center;line-height:1.4}
.pay{align-self:center;margin:8px 0;padding:8px 16px;border-radius:16px;background:#e6f8ec;color:#17803a;font-size:14px;font-weight:700;animation:pop .25s ease-out}
.pay.penalty{background:#ffebee;color:#c62828}

.b.img{padding:0;background:none;border-radius:18px;max-width:none}
.b.img::before,.b.img::after{display:none}
.shot{width:236px;background:#fff;color:#111;font-size:11px;line-height:1.4;border-radius:18px;overflow:hidden;border:1px solid rgba(0,0,0,.16);text-align:left;white-space:normal}
.sb{display:flex;justify-content:space-between;padding:7px 12px 4px;font-size:10px;font-weight:700;background:inherit}
.bh{background:#0f6b4f;color:#fff;padding:8px 12px 10px}
.bh small{display:block;font-size:10px;opacity:.8}
.bh b{font-size:14px}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid #eee}
.row .a{text-align:right;font-weight:700;white-space:nowrap}
.row.hl{background:#fff4bf}
.row small{display:block;color:#777;font-weight:400;font-size:10px}
.memo{padding:6px 12px 10px;color:#c92a2a;font-size:10.5px;font-weight:700}
.cb{background:#b9cde0;padding:6px 8px 10px;display:flex;flex-direction:column;gap:5px}
.cb .t{font-weight:700;text-align:center;padding:4px 0 2px;font-size:12px}
.cd{align-self:center;font-size:9.5px;color:#fff;background:rgba(0,0,0,.28);padding:2px 9px;border-radius:9px;margin:3px 0}
.cm{max-width:80%;padding:5px 9px;border-radius:10px;font-size:12px;background:#fff;align-self:flex-start}
.cm.m{align-self:flex-end;background:#fee500}
.sn{background:linear-gradient(165deg,#20243a,#6b2e58 60%,#e07a5f);color:#fff;padding-bottom:12px}
.sn .u{display:flex;align-items:center;gap:7px;padding:4px 12px 8px;font-size:11px}
.sn .p{width:24px;height:24px;border-radius:50%;background:#ffd166;color:#222;font-weight:700;display:flex;align-items:center;justify-content:center}
.sn .big{font-size:64px;text-align:center;padding:14px 0 4px}
.sn .cap{text-align:center;font-weight:700;font-size:14px;padding:0 12px}
.dh{background:#1f3a5f;color:#fff;padding:9px 12px;font-weight:700;font-size:13px}

.note.hint{background:#fff4bf;color:#7a5a00;padding:6px 12px;border-radius:12px;font-weight:600}
.chips button.hint{flex:1 1 100%;background:#fff4bf;color:#7a5a00;font-weight:600}
.dots{display:flex;gap:4px;padding:13px 14px}
.dots span{width:8px;height:8px;border-radius:50%;background:#a5a5ab;animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}

.card{align-self:center;width:92%;margin:14px 0;background:#f2f2f7;border-radius:20px;padding:18px 16px 16px;text-align:center;box-shadow:0 2px 14px rgba(0,0,0,.1)}
.card h2{font-size:21px;font-weight:700;margin-bottom:6px}
.card p{font-size:14.5px;line-height:1.5;color:#3c3c43;margin-bottom:14px}
.card-btns{display:flex;gap:8px;justify-content:center}
.card button{background:var(--blue);color:#fff;border:0;border-radius:20px;padding:10px 18px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.card button.sec{background:#e5e5ea;color:#000}

.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;background:#f6f6f8;border-top:.5px solid var(--line)}
.chips button{flex:1 1 auto;border:0;background:#fff;border-radius:8px;padding:9px 10px;font:inherit;font-size:14px;box-shadow:0 1px 0 rgba(0,0,0,.28);cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--blue);color:#fff}
.chips button:disabled{opacity:.4}
.inp{display:flex;align-items:center;gap:8px;padding:6px 10px calc(10px + env(safe-area-inset-bottom));background:#f6f6f8}
.plus{width:32px;height:32px;border-radius:50%;background:#e1e1e6;color:#6c6c70;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.field{flex:1;min-height:34px;border:1px solid var(--line);border-radius:18px;background:#fff;padding:6px 6px 6px 13px;display:flex;align-items:center;gap:6px}
#txt{flex:1;font-size:16px;color:#c0c0c5;line-height:1.3}
#txt.f{color:#000}
#send{width:26px;height:26px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:15px;font-weight:700;cursor:pointer;flex:none;visibility:hidden}
#send.on{visibility:visible}

@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes blink{50%{opacity:.3}}
</style>
</head>
<body>

<div class="phone">
  <!-- 1. 메인 로비 화면 -->
  <div class="lobby" id="lobby">
    <div class="lobby-header">
      <h1 class="lobby-title">그 돈 언제 줄래</h1>
      <p class="lobby-sub">떼인 돈을 받아내는 신개념 채권추심 게임</p>
    </div>
    <div class="stage-list">
      <div class="stage-card" id="card-1" onclick="selectStage(1)">
        <div class="stage-info">
          <h3>STAGE 1. 민수 <span style="font-size:13px;color:var(--sub);font-weight:400;">(친구)</span></h3>
          <p>못 받은 돈: 500,000원 · 기회 24회</p>
        </div>
        <span class="stage-tag" id="tag-1">도전</span>
      </div>
      <div class="stage-card" id="card-2" onclick="selectStage(2)">
        <div class="stage-info">
          <h3>STAGE 2. 태호 <span style="font-size:13px;color:var(--sub);font-weight:400;">(대학 선배)</span></h3>
          <p>못 받은 돈: 1,000,000원 · 기회 50회</p>
        </div>
        <span class="stage-tag" id="tag-2">도전</span>
      </div>
      <div class="stage-card" id="card-3" onclick="selectStage(3)">
        <div class="stage-info">
          <h3>STAGE 3. 박 사장 <span style="font-size:13px;color:var(--sub);font-weight:400;">(인테리어)</span></h3>
          <p>못 받은 돈: 10,000,000원 · 기회 50회</p>
        </div>
        <span class="stage-tag" id="tag-3">도전</span>
      </div>
    </div>
  </div>

  <!-- 2. 인게임 채팅 화면 -->
  <div class="game-view" id="gameView">
    <div class="nav">
      <button class="back-btn" onclick="showLobby()">‹ 로비</button>
      <div class="who"><div class="av" id="av">민</div><div class="nm" id="nm">민수 <i>›</i></div></div>
      <div class="sp"></div>
    </div>
    <div class="hud">
      <div class="top"><b id="ttl">그 돈 언제 줄래 · 500,000원</b><span id="turn"></span></div>
      <div class="ms">
        <div class="m"><span><em id="gl" style="font-style:normal">민수 버티기</em><b id="gv"></b></span><div class="bar"><i id="g" style="background:var(--red)"></i></div></div>
        <div class="m"><span>받은 돈<b id="fv"></b></span><div class="bar"><i id="f" style="width:0;background:var(--green)"></i></div></div>
      </div>
    </div>
    <div id="chat" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <div class="inp">
      <div class="plus">+</div>
      <div class="field"><div id="txt">iMessage</div><button id="send" aria-label="보내기">↑</button></div>
    </div>
  </div>
</div>

<script>
let MAX = 24, TOTAL = 500000, PAY = [], stage = 1, NM = "민수", GF = "윤서", HANDLE = "minsu_daily", TT, EE, HH;
const CFG = {
  1:{nm:"민수", gf:"윤서", handle:"minsu_daily", total:500000, max:24, hints:5, d:[5,-8,-18]},

  {ic:"💬", n:"정중하게", m:["민수야~ 잘 지내? 그 50만 원 언제쯤 가능할까?","혹시 이번 주 안에 보내줄 수 있어? 나도 좀 급해서 ㅎㅎ"]},
  {ic:"📸", n:"캡처 들이밀기", m:["이거 2년 전 추석 날짜 맞지?","증거는 이거고. 할 말 있어?","내가 이거 다 갖고 있다 ㅎㅎ"]},
  {ic:"😢", n:"감정 호소", m:["나 요즘 진짜 힘들어서 그래… 그 돈이 급해 ㅠㅠ","월세가 밀렸어… 나 좀 도와줘 ㅠㅠ"]},
  {ic:"👥", n:"공통친구 소환", m:["아 어제 지훈이 만났는데 네 얘기 나오더라? 😊","동창 단톡방에 물어볼까? 다들 궁금해하던데 ㅎㅎ"]},
  {ic:"⚖️", n:"최후통첩", m:["금요일까지 입금 안 되면 내용증명 보낸다.","오늘 6시까지. 그 뒤엔 나도 어쩔 수 없다."]},
  {ic:"🤫", n:"여친한테 꼰지르기", m:["윤서 인스타 아이디 뭐였지? 팔로우하려고~ 😊","(윤서에게 DM) 안녕하세요~ 민수 친구인데요, 혹시 민수가 돈 얘기 한 적 있어요?"]},
  {ic:"🎭", n:"똑같이 거짓말하기", m:["아 그래? 나도 엄마가 입원하셔서 돈이 없어…","나도 방금 너한테 보냈는데? 확인해봐 ㅇㅇ","나도 앱 오류로 이체가 안 돼 ㅠㅠ 한도 걸렸어"]}
];

const E = [
  {sys:"민수가 메시지를 읽었지만 답이 없다.", s:[1,1,0,2,0,1,0],
   r:["갑자기 답장이 왔다. 아 미안 ㅋㅋ 폰 잃어버렸었어","ㅇㅋ 알겠어… (3시간 만의 답장)","답이 없다. 오히려 더 깊이 잠수했다."]},
  {m:["나 요즘 너무 힘들어… 어제도 한숨도 못 잤어 ㅠㅠ","내가 이렇게 사는 거 알면서 꼭 그래야겠어…?"], s:[0,2,0,1,1,1,1],
   r:["…알겠어. 계좌 줘봐.","힘든 건 알겠는데… 일단 반만 줄게.","나는 더 힘들다고!!"]},
  {m:["근데 너 그때 내 생일에 밥 안 샀잖아?","야 너도 지난번에 5천 원 안 줬잖아"], s:[2,1,0,0,1,0,0],
   r:["…아 맞네 내가 할 말이 아니네. 미안.","그건 그거고…","와 진짜 치사하다."]},
  {m:["다음 달에 꼭 줄게! 진짜 약속!","월급날 지나면 바로 보낼게~ 걱정 마!"], s:[0,1,1,0,2,1,1],
   r:["…그럼 금요일 오후까지 보낼게.","알았어, 일단 조금 먼저…","다음 달에 줄게~ ㅎㅎ"]},
  {m:["(민수 인스타에 새 신발 사진이 올라왔다)","(민수 스토리: 🍣 오마카세 후기)"], s:[0,1,1,2,1,2,0], isSys:1,
   r:["아 그거… 선물 받은 거야!","…(스토리 삭제됨)","내 돈으로 내가 사는 건데?"]},
  {m:["우리 사이에 돈 얘기를 꼭 해야 돼?","친구끼리 이러는 거 좀 그렇지 않냐…"], s:[1,0,2,1,0,0,0],

   r:["…나도 마음이 안 좋다. 일단 보낼게.","그래 알겠어, 방법 찾아볼게.","내가 더 힘들다니까?"]},
  {m:["자꾸 이러면 나 너랑 연 끊는다?","계속 이럴 거면 나 번호 바꾼다"], s:[1,0,1,0,2,2,0],
   r:["…아 알았어 알았어. 보낼게.","…진짜 그러진 않겠지?","그래? 그럼 그렇게 해. 차단한다."]},
  {m:["방금 보냈는데? 확인해봐 ㅇㅇ","아 나 이미 보냈어. 네 쪽에서 확인 안 되는 거 아냐?"], s:[0,2,0,1,1,1,2],
   r:["…아 그게 사실 아직 안 보냈어 ㅎㅎ 지금 바로 보낼게!","은행 쪽 오류일 수도? 내일이면 들어갈걸?","내 쪽엔 분명 보냈다고 뜨는데? 네 통장이 이상한 거 아냐?"]},
  {m:["송금 한도에 걸렸어 ㅠㅠ 앱이 자꾸 오류가 나","은행 앱이 점검 중이래… 이체가 안 돼"], s:[1,1,0,1,2,0,2],
   r:["…알았어, 편의점 가서 바로 보낼게.","내일 은행 가 볼게… 아마도…","한도가 풀릴 때까지 기다려야 돼 어쩔 수 없어."]},
  {m:["엄마가 갑자기 입원하셨어… 병원비로 다 썼어","우리 엄마 요즘 많이 편찮으셔서… 돈이 없어"], s:[0,1,1,2,0,2,1],

}

  meters(); await sleep(600);
  
  for (const [th, amt] of PHASE) if (S.g <= th && !S.done["p"+th]) { S.done["p"+th] = 1; note("note", amt); }
  
  // 3단계: 유효타(효과가 1 이상)일 때마다 30만 원 ~ 100만 원 사이 랜덤 입금
  if (stage === 3 && sc > 0 && p.i !== 4) {
    const remain = TOTAL - S.paid;
    if (remain > 0) {
      // 버티기가 낮을수록 더 큰 금액 입금
      let multiplier = (100 - S.g) / 100;
      let rndAmt = Math.floor((Math.random() * 5 + 3 + multiplier * 4)) * 100000;
      let actualPay = Math.min(remain, rndAmt);
      S.paid += actualPay;
      note("pay", "💸 박 사장이 " + won(actualPay) + "을 입금했습니다!");
      meters(); await sleep(500);
    }
  } else if (stage < 3) {
    for (const [th, amt] of PAY) if (S.g <= th && !S.done[th]) {
      S.done[th] = 1; S.paid += amt; note("pay", "💸 " + NM + "에게서 " + won(amt) + "을 회수했다!"); meters(); await sleep(500);
    }
  }
  
  // 게이지가 0이 되었을 때 아직 남은 잔액이 있다면 일시불 처리
  if (S.g <= 0 && S.paid < TOTAL) {
    const remain = TOTAL - S.paid;
    S.paid = TOTAL;
    note("note", "🏳️ 박 사장이 결국 항복했습니다! 남은 잔액을 전액 입금합니다.");
    note("pay", "💸 박 사장이 남은 잔액 " + won(remain) + "을 전액 입금했습니다!");
    meters(); await sleep(600);
    return end(true);
  }

  if (S.paid >= TOTAL) return end(true);
  next();
};

function end(win){
  busy = false; chips(false);
  let R;
  if (win || S.paid >= TOTAL) {
    S.paid = TOTAL;
    localStorage.setItem('clear_stage_' + stage, 'true');
    R = ["🏆 " + won(TOTAL) + " 완납 성공!", S.t + "번 만에 " + NM + "에게서 모든 돈을 완벽히 회수했습니다!"];
  } else {
    R = ["📆 회수 실패…", "기회를 모두 사용했습니다. " + won(S.paid) + "만 회수하고 남은 돈은 받지 못했습니다."];
  }
  
  const d = document.createElement("div"); d.className = "card";
  d.innerHTML = "<h2>" + tx(R[0]) + "</h2><p>" + tx(R[1]) + "</p>"
    + "<div class='card-btns'>"
    + "<button onclick='start()'>다시 도전</button>"
    + "<button class='sec' onclick='showLobby()'>메인 로비로</button>"
    + "</div>";
  $("chat").appendChild(d); $("chat").scrollTop = 1e6;
}

// 최초 실행 시 로비 업데이트
updateLobbyUI();
</script>
